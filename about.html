<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/favicon/favicon.ico" type="image/x-icon" />
    <title>Anurag Dubey - About</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #faf9f6;
        --ink: #15171c;
        --line-light: rgba(21, 23, 28, 0.1);
        --gold: #b8863f;

        --void: #0a0d13;
        --star: #ece8df;
        --line-dark: rgba(236, 232, 223, 0.1);
        --gold-dark: #d9a441;
        --steel: #7c8896;
      }

      body,
      nav {
        font-family: "Inter", sans-serif;
        background-color: var(--paper);
        color: var(--ink);
      }

      .display {
        font-family: "Space Grotesk", sans-serif;
      }

      .hairline {
        border-color: var(--line-light);
      }

      .muted {
        color: #565c66;
      }

      .nav-link {
        position: relative;
        padding-bottom: 2px;
      }

      .nav-link::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 0;
        height: 1px;
        background: var(--gold);
        transition: width 0.25s ease;
      }

      .nav-link:hover::after {
        width: 100%;
      }

      #stars {
        opacity: 0;
        pointer-events: none;
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.15;
        }
        50% {
          opacity: 0.85;
        }
      }

      .star {
        animation: twinkle 5s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .star {
          animation: none;
          opacity: 0.4;
        }
      }

      /* Dark mode */
      html.dark body,
      html.dark nav {
        background-color: var(--void);
        color: var(--star);
      }
      html.dark .hairline {
        border-color: var(--line-dark);
      }
      html.dark .muted {
        color: var(--steel);
      }
      html.dark .nav-link::after {
        background: var(--gold-dark);
      }
      html.dark #stars {
        opacity: 1;
      }

      .menu-hidden {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.5s ease;
      }
      .menu-visible {
        max-height: 100vh;
        transition: max-height 0.5s ease;
      }
    </style>
    <script>
      if (
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches
      ) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body class="relative overflow-x-hidden">
    <!-- Ambient starfield, dark mode only, matches the rest of the site -->
    <svg
      id="stars"
      class="fixed inset-0 w-full h-full -z-10 transition-opacity duration-700"
      xmlns="http://www.w3.org/2000/svg"
    >
      <circle class="star" cx="6%" cy="12%" r="1" fill="#ECE8DF" style="animation-delay:0s" />
      <circle class="star" cx="18%" cy="30%" r="1.4" fill="#ECE8DF" style="animation-delay:1.2s" />
      <circle class="star" cx="27%" cy="8%" r="1" fill="#ECE8DF" style="animation-delay:2.4s" />
      <circle class="star" cx="41%" cy="22%" r="1.6" fill="#ECE8DF" style="animation-delay:0.6s" />
      <circle class="star" cx="53%" cy="14%" r="1" fill="#ECE8DF" style="animation-delay:3s" />
      <circle class="star" cx="64%" cy="34%" r="1.2" fill="#ECE8DF" style="animation-delay:1.8s" />
      <circle class="star" cx="72%" cy="9%" r="1" fill="#ECE8DF" style="animation-delay:2.7s" />
      <circle class="star" cx="83%" cy="26%" r="1.6" fill="#ECE8DF" style="animation-delay:0.3s" />
      <circle class="star" cx="92%" cy="16%" r="1" fill="#ECE8DF" style="animation-delay:3.6s" />
      <circle class="star" cx="11%" cy="52%" r="1.2" fill="#ECE8DF" style="animation-delay:1.5s" />
      <circle class="star" cx="24%" cy="66%" r="1" fill="#ECE8DF" style="animation-delay:2.1s" />
      <circle class="star" cx="36%" cy="48%" r="1.4" fill="#ECE8DF" style="animation-delay:0.9s" />
      <circle class="star" cx="47%" cy="72%" r="1" fill="#ECE8DF" style="animation-delay:3.3s" />
      <circle class="star" cx="58%" cy="58%" r="1.6" fill="#ECE8DF" style="animation-delay:1.1s" />
      <circle class="star" cx="69%" cy="76%" r="1" fill="#ECE8DF" style="animation-delay:2.9s" />
      <circle class="star" cx="79%" cy="62%" r="1.2" fill="#ECE8DF" style="animation-delay:0.4s" />
      <circle class="star" cx="88%" cy="80%" r="1" fill="#ECE8DF" style="animation-delay:4s" />
      <circle class="star" cx="4%" cy="88%" r="1.4" fill="#ECE8DF" style="animation-delay:1.7s" />
      <circle class="star" cx="95%" cy="46%" r="1" fill="#ECE8DF" style="animation-delay:2.3s" />
      <circle class="star" cx="15%" cy="92%" r="1" fill="#ECE8DF" style="animation-delay:0.7s" />
    </svg>

    <nav class="relative px-6 py-5 hairline border-b">
      <div class="container mx-auto flex justify-end md:justify-center items-center">
        <ul class="hidden md:flex space-x-10 text-sm">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="projects.html" class="nav-link">Projects</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>

        <div class="md:hidden">
          <button
            id="menu-toggle"
            class="focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2"
            aria-expanded="false"
            aria-controls="mobile-menu"
            aria-label="Toggle navigation menu"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3.75 9h16.5m-16.5 6.75h16.5"
              />
            </svg>
          </button>
        </div>
      </div>

      <div id="mobile-menu" class="menu-hidden md:hidden">
        <ul class="flex flex-col space-y-4 text-center items-center mt-6 pb-2 text-sm">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="projects.html" class="nav-link">Projects</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
      </div>
    </nav>

    <section class="flex flex-col justify-center px-6 md:px-16 py-24 md:py-36 min-h-[60vh]">
      <div class="max-w-2xl">
        <h1 class="display text-4xl md:text-6xl font-medium leading-tight tracking-tight">
          About me
        </h1>
        <p class="muted text-lg mt-6 leading-relaxed max-w-lg">
          A brief introduction to me, my background, and my interests.
        </p>
      </div>
    </section>

    <script>
      const toggle = document.getElementById("menu-toggle");
      const menu = document.getElementById("mobile-menu");
      toggle.addEventListener("click", function () {
        const isOpen = menu.classList.contains("menu-visible");
        menu.classList.toggle("menu-hidden");
        menu.classList.toggle("menu-visible");
        toggle.setAttribute("aria-expanded", String(!isOpen));
      });
    </script>
  </body>
</html>
